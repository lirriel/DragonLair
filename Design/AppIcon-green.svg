<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="75%">
      <stop offset="0" stop-color="#6A55C9"/>
      <stop offset="0.6" stop-color="#3D2C8D"/>
      <stop offset="1" stop-color="#22184F"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="80%" r="50%">
      <stop offset="0" stop-color="#FFD966" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#FFD966" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFE27A"/>
      <stop offset="0.5" stop-color="#FFC233"/>
      <stop offset="1" stop-color="#E08A10"/>
    </linearGradient>
    <linearGradient id="coin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF0A6"/>
      <stop offset="1" stop-color="#FFC233"/>
    </linearGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8BE39B"/>
      <stop offset="1" stop-color="#4FBF6E"/>
    </linearGradient>
    <linearGradient id="wing" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3FA864"/>
      <stop offset="1" stop-color="#2E8A55"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect width="1024" height="1024" fill="url(#glow)"/>

  <!-- sparkles -->
  <g fill="#FFF3C4">
    <path d="M160 190 Q166 214 190 220 Q166 226 160 250 Q154 226 130 220 Q154 214 160 190Z"/>
    <path d="M870 150 Q878 182 910 190 Q878 198 870 230 Q862 198 830 190 Q862 182 870 150Z"/>
    <path d="M880 520 Q884 536 900 540 Q884 544 880 560 Q876 544 860 540 Q876 536 880 520Z"/>
    <path d="M130 520 Q135 540 155 545 Q135 550 130 570 Q125 550 105 545 Q125 540 130 520Z"/>
    <circle cx="250" cy="110" r="7"/>
    <circle cx="760" cy="90" r="6"/>
    <circle cx="950" cy="380" r="6"/>
    <circle cx="70" cy="380" r="5"/>
  </g>

  <!-- back hoard -->
  <path d="M0 1024 L0 850 Q140 760 290 785 Q410 735 512 760 Q630 730 740 780 Q890 745 1024 840 L1024 1024 Z" fill="url(#gold)"/>

  <!-- crown in the hoard -->
  <g stroke="#B5650A" stroke-width="8" stroke-linejoin="round">
    <path d="M150 815 L160 725 L205 768 L235 705 L265 768 L310 725 L318 815 Z" fill="#FFD23F"/>
    <circle cx="235" cy="700" r="12" fill="#FFE27A"/>
    <circle cx="160" cy="722" r="10" fill="#FFE27A"/>
    <circle cx="310" cy="722" r="10" fill="#FFE27A"/>
  </g>
  <circle cx="234" cy="785" r="16" fill="#FF4F6D" stroke="#B5650A" stroke-width="6"/>

  <!-- coin stack -->
  <g stroke="#B5650A" stroke-width="7" fill="url(#coin)">
    <path d="M770 820 L770 790 A48 18 0 0 1 866 790 L866 820 A48 18 0 0 1 770 820 Z"/>
    <path d="M776 790 L776 760 A46 17 0 0 1 868 760 L868 790 A46 17 0 0 1 776 790 Z"/>
    <path d="M766 760 L766 730 A47 17 0 0 1 860 730 L860 760 A47 17 0 0 1 766 760 Z"/>
    <ellipse cx="813" cy="730" rx="47" ry="17"/>
  </g>

  <!-- wings -->
  <g stroke="#215F3B" stroke-width="10" stroke-linejoin="round">
    <path d="M370 560 Q250 400 170 450 Q200 480 205 505 Q160 520 175 575 Q225 565 250 600 Q290 590 345 640 Z" fill="url(#wing)"/>
    <path d="M654 560 Q774 400 854 450 Q824 480 819 505 Q864 520 849 575 Q799 565 774 600 Q734 590 679 640 Z" fill="url(#wing)"/>
  </g>

  <!-- tail -->
  <path d="M660 740 C790 735 850 790 815 870" fill="none" stroke="#215F3B" stroke-width="74" stroke-linecap="round"/>
  <path d="M660 740 C790 735 850 790 815 870" fill="none" stroke="#5CC97A" stroke-width="56" stroke-linecap="round"/>
  <path d="M815 860 Q770 880 780 935 Q830 925 852 880 Q860 850 815 860 Z" fill="#FF8A65" stroke="#B2463A" stroke-width="8" stroke-linejoin="round"/>

  <!-- body -->
  <ellipse cx="512" cy="640" rx="195" ry="188" fill="url(#skin)" stroke="#215F3B" stroke-width="10"/>
  <ellipse cx="512" cy="672" rx="128" ry="138" fill="#FFEBC4"/>
  <g fill="none" stroke="#F1CB8C" stroke-width="8" stroke-linecap="round">
    <path d="M410 640 Q512 660 614 640"/>
    <path d="M400 700 Q512 722 624 700"/>
    <path d="M418 760 Q512 780 606 760"/>
  </g>

  <!-- feet -->
  <g stroke="#215F3B" stroke-width="10">
    <ellipse cx="405" cy="805" rx="72" ry="42" fill="#5CC97A"/>
    <ellipse cx="619" cy="805" rx="72" ry="42" fill="#5CC97A"/>
  </g>
  <g fill="#FFF3D6">
    <circle cx="362" cy="828" r="11"/><circle cx="395" cy="838" r="11"/><circle cx="430" cy="836" r="11"/>
    <circle cx="594" cy="836" r="11"/><circle cx="629" cy="838" r="11"/><circle cx="662" cy="828" r="11"/>
  </g>

  <!-- head frills / ears -->
  <g stroke="#215F3B" stroke-width="10" stroke-linejoin="round" fill="#3FA864">
    <path d="M355 300 Q275 270 255 330 Q300 370 360 365 Z"/>
    <path d="M669 300 Q749 270 769 330 Q724 370 664 365 Z"/>
  </g>

  <!-- horns -->
  <g stroke="#A7752A" stroke-width="9" stroke-linejoin="round" fill="#FFE6A8">
    <path d="M405 235 Q370 150 392 120 Q440 160 460 212 Z"/>
    <path d="M619 235 Q654 150 632 120 Q584 160 564 212 Z"/>
  </g>

  <!-- head spikes -->
  <g fill="#FF8A65" stroke="#B2463A" stroke-width="8" stroke-linejoin="round">
    <path d="M484 200 Q512 105 540 200 Z"/>
    <path d="M440 214 Q450 160 476 205 Z"/>
    <path d="M584 214 Q574 160 548 205 Z"/>
  </g>

  <!-- head -->
  <circle cx="512" cy="365" r="178" fill="url(#skin)" stroke="#215F3B" stroke-width="10"/>
  <ellipse cx="512" cy="452" rx="92" ry="56" fill="#A6EDB2"/>

  <!-- eyes -->
  <g fill="#24183A">
    <ellipse cx="445" cy="365" rx="44" ry="54"/>
    <ellipse cx="579" cy="365" rx="44" ry="54"/>
  </g>
  <g fill="#FFFFFF">
    <circle cx="459" cy="343" r="17"/>
    <circle cx="433" cy="388" r="8"/>
    <circle cx="593" cy="343" r="17"/>
    <circle cx="567" cy="388" r="8"/>
  </g>

  <!-- blush -->
  <g fill="#FF8FA3" opacity="0.75">
    <ellipse cx="388" cy="440" rx="32" ry="17"/>
    <ellipse cx="636" cy="440" rx="32" ry="17"/>
  </g>

  <!-- nostrils + smile -->
  <g fill="#2E8A55">
    <ellipse cx="490" cy="434" rx="7" ry="5"/>
    <ellipse cx="534" cy="434" rx="7" ry="5"/>
  </g>
  <path d="M478 466 Q512 498 546 466" fill="none" stroke="#24183A" stroke-width="9" stroke-linecap="round"/>
  <path d="M526 476 L534 494 L540 471 Z" fill="#FFFFFF"/>

  <!-- hugged coin with bookmark emblem -->
  <circle cx="512" cy="650" r="78" fill="url(#coin)" stroke="#B5650A" stroke-width="10"/>
  <circle cx="512" cy="650" r="56" fill="none" stroke="#E7A322" stroke-width="7"/>
  <path d="M488 612 L536 612 L536 690 L512 670 L488 690 Z" fill="#FF4F6D" stroke="#A8233F" stroke-width="6" stroke-linejoin="round"/>

  <!-- arms -->
  <g stroke="#215F3B" stroke-width="10" fill="#5CC97A">
    <ellipse cx="438" cy="640" rx="38" ry="62" transform="rotate(-28 438 640)"/>
    <ellipse cx="586" cy="640" rx="38" ry="62" transform="rotate(28 586 640)"/>
  </g>

  <!-- front coins & gems -->
  <g stroke="#B5650A" stroke-width="7">
    <ellipse cx="300" cy="880" rx="58" ry="22" fill="url(#coin)"/>
    <ellipse cx="512" cy="905" rx="62" ry="23" fill="url(#coin)"/>
    <ellipse cx="700" cy="945" rx="58" ry="22" fill="url(#coin)"/>
    <ellipse cx="420" cy="970" rx="58" ry="22" fill="url(#coin)"/>
    <ellipse cx="120" cy="950" rx="55" ry="21" fill="url(#coin)"/>
    <ellipse cx="900" cy="990" rx="55" ry="21" fill="url(#coin)"/>
    <ellipse cx="610" cy="860" rx="50" ry="19" fill="url(#coin)"/>
  </g>
  <g stroke-width="7" stroke-linejoin="round">
    <path d="M190 850 L222 820 L254 850 L222 900 Z" fill="#4FC3F7" stroke="#1F6F9E"/>
    <path d="M880 860 L915 830 L950 860 L915 910 Z" fill="#FF4F6D" stroke="#A8233F"/>
    <path d="M560 990 L585 965 L610 990 L585 1024 Z" fill="#B388FF" stroke="#5E35B1"/>
  </g>
  <g fill="#FFFFFF" opacity="0.8">
    <path d="M205 840 L222 826 L230 838 Z"/>
    <path d="M895 850 L915 836 L922 848 Z"/>
  </g>
</svg>
