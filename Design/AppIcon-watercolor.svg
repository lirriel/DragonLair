    <ellipse cx="540" cy="430" rx="11" ry="9"/>
    <ellipse cx="562" cy="485" rx="14" ry="11"/>
    <ellipse cx="605" cy="550" rx="15" ry="12"/>
    <ellipse cx="652" cy="605" rx="19" ry="14"/>
    <ellipse cx="692" cy="668" rx="16" ry="13"/>
    <ellipse cx="610" cy="640" rx="11" ry="9"/>
    <ellipse cx="664" cy="740" rx="22" ry="16"/>
    <ellipse cx="712" cy="760" rx="12" ry="10"/>
    <ellipse cx="640" cy="905" rx="18" ry="9"/>
    <ellipse cx="520" cy="935" rx="16" ry="8"/>
    <ellipse cx="400" cy="925" rx="14" ry="7"/>
    <ellipse cx="290" cy="903" rx="11" ry="6"/>
  </g>

  <!-- back foot -->
  <g filter="url(#wc2)">
    <path d="M488 870 C490 840 560 830 605 845 C620 860 600 878 560 880 C530 882 500 882 488 870 Z" fill="#9B4528"/>
  </g>
  <g stroke="#3E1E14" stroke-width="6" stroke-linecap="round" filter="url(#soft)">
    <path d="M496 872 L482 882"/><path d="M520 878 L508 890"/><path d="M546 880 L536 893"/>
  </g>

  <!-- hugged coin + little arms -->
  <g filter="url(#wc2)">
    <ellipse cx="452" cy="692" rx="56" ry="60" fill="#F0C665"/>
  </g>
  <ellipse cx="452" cy="692" rx="39" ry="43" fill="none" stroke="#C99332" stroke-width="5" filter="url(#soft)"/>
  <path d="M438 664 L466 664 L466 716 L452 703 L438 716 Z" fill="#B33A35" filter="url(#soft)"/>
  <g filter="url(#wc2)" fill="#A84D2D">
    <path d="M500 600 C478 612 466 640 448 652 C432 662 412 660 404 672 C400 684 414 690 428 686 C456 680 482 664 506 640 Z"/>
    <path d="M508 700 C488 712 476 735 456 744 C440 750 422 748 416 760 C414 772 428 776 442 772 C470 766 496 748 516 730 Z"/>
  </g>
  <g stroke="#3E1E14" stroke-width="5" stroke-linecap="round" filter="url(#soft)">
    <path d="M408 668 L396 660"/><path d="M406 680 L392 681"/>
    <path d="M420 757 L407 751"/><path d="M420 769 L405 771"/>
  </g>

  <!-- horns -->
  <g filter="url(#wc2)">
    <path d="M478 252 C488 205 516 178 552 168 C532 198 520 228 514 262 Z" fill="#6E3020"/>
    <path d="M505 262 C535 220 585 196 628 198 C598 220 572 248 548 282 Z" fill="#8A3D25"/>
  </g>

  <!-- head -->
  <g filter="url(#wc)">
    <path d="M548 300 C543 240 478 222 436 248 C410 264 398 284 382 296 C342 298 312 324 318 352 C324 380 362 392 402 394 C444 402 504 402 534 382 C556 362 552 330 548 300 Z" fill="#BC5E36"/>
  </g>
  <g filter="url(#wc)">
    <path d="M330 372 C362 390 420 398 466 400 C506 401 535 392 545 372 C500 388 420 384 330 360 Z" fill="#8A3A22" opacity="0.55"/>
  </g>
  <!-- ear frill -->
  <g filter="url(#wc2)">
    <path d="M540 312 C575 292 612 292 630 302 C610 326 580 340 552 345 Z" fill="#EAA67E"/>
  </g>
  <g fill="#F4C29C" opacity="0.65" filter="url(#wc2)">
    <ellipse cx="518" cy="372" rx="11" ry="8"/>
    <ellipse cx="530" cy="340" rx="8" ry="6"/>
    <ellipse cx="500" cy="258" rx="8" ry="6"/>
  </g>

  <!-- eye -->
  <circle cx="452" cy="306" r="42" fill="#F2B530" stroke="#4A2016" stroke-width="5" filter="url(#soft)"/>
  <circle cx="452" cy="306" r="30" fill="#F8CF58" opacity="0.8"/>
  <ellipse cx="447" cy="311" rx="8" ry="23" fill="#2B130D"/>
  <circle cx="464" cy="290" r="8" fill="#FFF9EA"/>
  <circle cx="440" cy="330" r="3.5" fill="#FFF9EA"/>
  <!-- nostril, smile, blush -->
  <ellipse cx="338" cy="334" rx="5" ry="4" fill="#3E1E14"/>
  <path d="M336 362 Q370 378 404 372" fill="none" stroke="#4A2016" stroke-width="5" stroke-linecap="round" opacity="0.75" filter="url(#soft)"/>
  <ellipse cx="400" cy="358" rx="22" ry="10" fill="#E9737A" opacity="0.45" filter="url(#wc2)"/>

  <!-- paper grain -->
  <rect width="1024" height="1024" filter="url(#paper)" opacity="0.18"/>
</svg>
