name: CI

on:
  push:
    branches: [main]
    paths-ignore: &docs-only
      - "Design/**"
      - "docs/**"
      - "**/*.md"
  pull_request:
    paths-ignore: *docs-only
  workflow_dispatch:

# A newer push to the same branch or PR cancels the run still in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Keep in step with the XcodeGen used locally. Other versions write a different project file,
  # which would fail the sync check below.
  XCODEGEN_VERSION: "2.46.0"

jobs:
  build:
    name: Build (iOS Simulator)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: maxim-lobanov/setup-xcode@v1.7.0
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen ${{ env.XCODEGEN_VERSION }}
        run: |
          curl -fsSL -o "$RUNNER_TEMP/xcodegen.zip" \
            "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip"
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/xcodegen/bin" >> "$GITHUB_PATH"

      - name: Check the Xcode project matches project.yml
        run: |
          xcodegen generate --quiet
          if ! git diff --exit-code -- EndlessBookmark.xcodeproj; then
            echo "::error::EndlessBookmark.xcodeproj is out of date. Run 'xcodegen generate' and commit the result."
            exit 1
          fi

      - name: Build app and Share Extension
        run: |
          set -o pipefail
          xcodebuild build \
            -project EndlessBookmark.xcodeproj \
            -scheme EndlessBookmark \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            | tee "$RUNNER_TEMP/xcodebuild.log" \
            | grep -E '(error|warning):|\*\* BUILD' || true
          grep -q '\*\* BUILD SUCCEEDED \*\*' "$RUNNER_TEMP/xcodebuild.log"

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: xcodebuild-log
          path: ${{ runner.temp }}/xcodebuild.log
