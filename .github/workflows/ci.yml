name: CI

on:
  push:
    branches: [main]
    paths-ignore: &docs-only
      - "Design/**"
      - "docs/**"
      - "**/*.md"
  pull_request:
    paths-ignore: *docs-only
  workflow_dispatch:

# A newer push to the same branch or PR cancels the run still in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Keep in step with the XcodeGen used locally. Other versions write a different project file,
  # which would fail the sync check below.
  XCODEGEN_VERSION: "2.46.0"

jobs:
  build:
    name: Build and test (iOS Simulator)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: maxim-lobanov/setup-xcode@v1.7.0
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen ${{ env.XCODEGEN_VERSION }}
        run: |
          curl -fsSL -o "$RUNNER_TEMP/xcodegen.zip" \
            "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip"
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/xcodegen/bin" >> "$GITHUB_PATH"

      - name: Check the Xcode project matches project.yml
        run: |
          xcodegen generate --quiet
          if ! git diff --exit-code -- DragonLair.xcodeproj; then
            echo "::error::DragonLair.xcodeproj is out of date. Run 'xcodegen generate' and commit the result."
            exit 1
          fi

      - name: Build and run unit tests
        run: |
          set -o pipefail
          # Any available iPhone simulator, newest iOS first, so runner image updates don't break this.
          UDID=$(xcrun simctl list devices available -j | python3 -c 'import json, sys
          devices = json.load(sys.stdin)["devices"]
          print(next(d["udid"] for runtime, list_ in sorted(devices.items(), reverse=True)
                     if "iOS" in runtime for d in list_ if d["name"].startswith("iPhone")))')
          echo "Testing on simulator $UDID"
          xcodebuild test \
            -project DragonLair.xcodeproj \
            -scheme DragonLair \
            -destination "platform=iOS Simulator,id=$UDID" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            | tee "$RUNNER_TEMP/xcodebuild.log" \
            | grep -E '(error|warning):|✔|✘|\*\* (BUILD|TEST)' || true
          grep -q '\*\* TEST SUCCEEDED \*\*' "$RUNNER_TEMP/xcodebuild.log"

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: xcodebuild-log
          path: ${{ runner.temp }}/xcodebuild.log
