name: DragonLair
options:
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
# The team and APP_ID come from Config/Base.xcconfig, overridden by an uncommitted
# Config/Local.xcconfig. Every other identifier is derived from APP_ID.
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
targets:
  DragonLair:
    type: application
    platform: iOS
    sources: [DragonLair, Shared]
    dependencies:
      - target: ShareExtension
    scheme:
      testTargets: [DragonLairTests]
    info:
      path: DragonLair/Info.plist
      properties:
        # Continued processing tasks get a per-run suffix, see BackgroundImport.
        BGTaskSchedulerPermittedIdentifiers: [$(APP_ID).import.*]
        # With "limited" photo access iOS otherwise asks to select more photos on every launch.
        # The Screenshots folder screen offers that instead.
        PHPhotoLibraryPreventAutomaticLimitedAccessAlert: true
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Read by AppID.base to build the App Group, background task and Keychain names.
        AppIdentifier: $(APP_ID)
    entitlements:
      path: DragonLair/DragonLair.entitlements
      properties:
        com.apple.security.application-groups: [group.$(APP_ID)]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_ID)
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "Dragon Lair"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "Dragon Lair reads your Screenshots album to turn screenshots into bookmarks."
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic

  DragonLairTests:
    type: bundle.unit-test
    platform: iOS
    sources: [DragonLairTests]
    dependencies:
      - target: DragonLair
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_ID).tests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic

  ShareExtension:
    type: app-extension
    platform: iOS
    sources: [ShareExtension, Shared]
    entitlements:
      path: ShareExtension/ShareExtension.entitlements
      properties:
        com.apple.security.application-groups: [group.$(APP_ID)]
    info:
      path: ShareExtension/Info.plist
      properties:
        CFBundleDisplayName: "Dragon Lair"
        # Must match the app's version, or App Store uploads are rejected.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        AppIdentifier: $(APP_ID)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsImageWithMaxCount: 50
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_ID).share
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
